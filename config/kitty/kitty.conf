include themes/color-theme.conf

background_opacity 0

cursor_shape underline
cursor_blink_interval 1

font_size 10

font_family      family='Google Sans Code' style=Medium variable_name=GoogleSansCode
bold_font        family='Google Sans Code' style=ExtraBold variable_name=GoogleSansCode
italic_font      family='Google Sans Code' style=Medium variable_name=GoogleSansCodeItalic
bold_italic_font family='Google Sans Code' style=ExtraBold variable_name=GoogleSansCodeItalic